<div class="home-layout">
  <header class="top-nav-bar">
    <nav class="nav-links">
      <a routerLink="overview" routerLinkActive="active">Overview</a>
      <a routerLink="inventory" routerLinkActive="active">Inventory</a>
      <a routerLink="people" routerLinkActive="active">People</a>
      <button type="button" class="nav-search-link" (click)="openSearch()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search</span><kbd>Ctrl+K</kbd>
      </button>
    </nav>
    <div class="user-menu" #userMenu>
      <button type="button" class="user-badge" aria-haspopup="dialog" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
        <span class="user-avatar">{{ user.initials }}</span>
        <span class="user-meta">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role">{{ user.role }}</span>
        </span>
        <span class="user-caret"></span>
      </button>

      @if (menuOpen()) {
        <div class="user-popup" role="dialog" aria-label="Admin details">
          <div class="popup-head">
            <span class="user-avatar large">{{ user.initials }}</span>
            <div>
              <strong>{{ user.name }}</strong>
              <span>{{ user.role }}</span>
            </div>
          </div>
          <dl class="popup-details">
            <div><dt>Role</dt><dd>{{ user.role }}</dd></div>
            <div><dt>Yard</dt><dd>{{ user.yard }}</dd></div>
            <div><dt>Email</dt><dd>{{ user.email }}</dd></div>
          </dl>
          <button type="button" class="logout-btn" (click)="logout()">Log out</button>
        </div>
      }
    </div>
  </header>

  <main class="content-viewport">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-links" aria-label="Footer">
        <a href="https://www.aplusmotors.co.ke" target="_blank" rel="noopener">Go To Main Website</a>
        <a routerLink="help">Edit Help</a>
        <a routerLink="settings">Edit Settings</a>
        <a routerLink="privacy">Edit Privacy</a>
        <a routerLink="terms">Edit Terms</a>
      </nav>
    </div>
  </footer>

  <app-search #searchComp />
</div>
