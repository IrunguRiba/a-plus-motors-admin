<div class="home-layout">
  <header class="top-nav-bar">
    <nav class="nav-links">
      <a routerLink="overview" routerLinkActive="active">
        Overview
        <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <kbd>Ctrl+1</kbd>
      </a>

      <a routerLink="inventory" routerLinkActive="active">
        Inventory
        <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
          <path d="m3.3 7 8.7 5 8.7-5"/>
          <path d="M12 22V12"/>
        </svg>
      </a>

      <a routerLink="people" routerLinkActive="active">
        People
        <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </a>

      <button type="button" class="nav-search-link" (click)="openSearch()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search</span><kbd>Ctrl+K</kbd>
      </button>
    </nav>

    <div class="user-menu" #userMenu>
      <button type="button" class="user-badge" aria-haspopup="dialog" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
        <span class="user-avatar">{{ user.initials }}</span>
        <span class="user-meta">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role">{{ user.role }}</span>
        </span>
        <span class="user-caret"></span>
      </button>

      @if (menuOpen()) {
        <div class="user-popup" role="dialog" aria-label="Admin details">
          <div class="popup-head">
            <span class="user-avatar large">{{ user.initials }}</span>
            <div>
              <strong>{{ user.name }}</strong>
              <span>{{ user.role }}</span>
            </div>
          </div>
          <dl class="popup-details">
            <div><dt>Role</dt><dd>{{ user.role }}</dd></div>
            <div><dt>Yard</dt><dd>{{ user.yard }}</dd></div>
            <div><dt>Email</dt><dd>{{ user.email }}</dd></div>
          </dl>
          <button type="button" class="logout-btn" (click)="logout()">Log out</button>
        </div>
      }
    </div>
  </header>

  <main class="content-viewport">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-links" aria-label="Footer">
        <a href="https://a-plus-motors.vercel.app/home" target="_blank" rel="noopener">
         A-PLUS LTD Website
          <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M15 3h6v6"/>
            <path d="M10 14 21 3"/>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          </svg>
        </a>

        <a routerLink="help">
          Site Help
          <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <path d="M12 17h.01"/>
          </svg>
        </a>

        <a routerLink="settings">
          Admin Settings
          <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </a>

        <a routerLink="privacy">
          Site Privacy
          <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </a>

        <a routerLink="terms">
          Site Terms
          <svg class="esc-img" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <path d="M10 9H8"/>
            <path d="M16 13H8"/>
            <path d="M16 17H8"/>
          </svg>
        </a>
      </nav>
    </div>
  </footer>

  <app-search #searchComp />
</div>
